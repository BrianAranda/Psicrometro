<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Control Inteligente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="background-animation"></div>

    <main class="dashboard-container">

        <header class="header-card glass-card">
            <h1>Panel de Datos</h1>
            <div class="datetime-display">
                <span id="fechayhora">%FECHA%</span>
            </div>
        </header>

        <section class="sensors-grid">
            <div class="sensor-card glass-card">
                <div class="sensor-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22a5 5 0 0 0 5-5c0-2-2.5-7-5-12-2.5 5-5 10-5 12a5 5 0 0 0 5 5z"></path>
                    </svg>
                </div>
                <div class="sensor-info">
                    <h2>Humedad Relativa</h2>
                    <p class="sensor-value"><span id="humedad">%HUMEDAD%</span><span class="unit">%</span></p>
                </div>
            </div>

            <div class="sensor-card glass-card">
                <div class="sensor-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                    </svg>
                </div>
                <div class="sensor-info">
                    <h2>Temperatura</h2>
                    <p class="sensor-value"><span id="temperatura">%temperatura%</span><span class="unit">°C</span></p>
                </div>
            </div>
        </section>

        <section class="config-card glass-card">
            <h2>Configurar Fecha y Hora</h2>
            <form id="timeForm" class="modern-form">
                <div class="input-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="input-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" required>
                </div>

                <button type="button" id="guardar_fecha" class="primary-btn">
                    <span>Guardar Configuración</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </form>
        </section>

        <section class="download-card glass-card" style="margin-top: 2rem;">
            <h2>Descarga de Datos</h2>
            <p style="margin-bottom: 1rem; color: #a1a1aa; font-size: 0.9rem;">
                Descarga el registro de humedad y temperaturas de las últimas 24 horas en formato CSV.
            </p>
            <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; margin-top: 1.5rem;">
                <span style="font-size: 0.9rem; font-weight: 500;">Progreso de Registro</span>
                <span id="progresoTexto"
                      style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">0/720 (0%)</span>
            </div>
            <div class="progress-bar-container" style="height: 8px; margin-bottom: 1.5rem;">
                <div id="progresoBarra" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <a href="/download.csv" class="primary-btn" style="text-decoration: none; display: inline-flex; justify-content: center;">
                <span>Descargar CSV</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </a>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
